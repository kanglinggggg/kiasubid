[project]
name = "gebiz-bidops"
version = "0.1.0"
description = "Evidence-backed bid obligation control for Singapore SMEs"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=0.6,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "pypdf>=6.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
